<style id="css">
:root{
  --ground:#FAFAF9; --surface:#FFFFFF; --surface-2:#F1F1EF;
  --ink:#1A1A18; --ink-2:#4A4A46; --ink-3:#7B7B75;
  --line:#DEDEDA; --line-2:#C4C4BE;
  --accent:#3A4A5C; --accent-soft:#E7EBEF;
  --s0:#8A8A84; --s0-bg:#EFEFED;
  --s1:#8A5A12; --s1-bg:#F8EFDC;
  --s2:#1F6647; --s2-bg:#E1EFE8;
  --crit:#963226; --crit-bg:#F7E4E0;
  --shadow:0 1px 2px rgba(26,26,24,.05), 0 8px 22px -16px rgba(26,26,24,.3);
  --shadow-lg:0 20px 60px -20px rgba(26,26,24,.4);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#12130F; --surface:#1A1B17; --surface-2:#22241F;
    --ink:#EDEDE8; --ink-2:#BCBCB4; --ink-3:#8B8B83;
    --line:#2C2E28; --line-2:#3C3F37;
    --accent:#9FB3C8; --accent-soft:#1D2530;
    --s0:#8B8B83; --s0-bg:#232320;
    --s1:#D6A44E; --s1-bg:#2C2415;
    --s2:#6FBE96; --s2-bg:#15291F;
    --crit:#E08A7D; --crit-bg:#2E1C19;
    --shadow:0 1px 2px rgba(0,0,0,.45), 0 8px 22px -16px rgba(0,0,0,.8);
    --shadow-lg:0 20px 60px -20px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --ground:#12130F; --surface:#1A1B17; --surface-2:#22241F;
  --ink:#EDEDE8; --ink-2:#BCBCB4; --ink-3:#8B8B83;
  --line:#2C2E28; --line-2:#3C3F37;
  --accent:#9FB3C8; --accent-soft:#1D2530;
  --s0:#8B8B83; --s0-bg:#232320;
  --s1:#D6A44E; --s1-bg:#2C2415;
  --s2:#6FBE96; --s2-bg:#15291F;
  --crit:#E08A7D; --crit-bg:#2E1C19;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 8px 22px -16px rgba(0,0,0,.8);
  --shadow-lg:0 20px 60px -20px rgba(0,0,0,.9);
}

*{box-sizing:border-box}
body{margin:0; background:var(--ground); color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:16px; line-height:1.7; -webkit-font-smoothing:antialiased}
.wrap{max-width:80rem; margin:0 auto; padding:0 clamp(.9rem,3vw,2rem) 6rem}
h1{margin:0; font-size:clamp(1.7rem,4vw,2.4rem); font-weight:900; letter-spacing:-.02em}
h2{margin:0; font-size:1.1rem; font-weight:700}
p{margin:0}

.brands{display:flex; gap:.55rem; margin-bottom:1.4rem; flex-wrap:wrap}
.brands img{width:4rem; height:4rem; border-radius:9px; display:block;
  border:1px solid var(--line); box-shadow:var(--shadow)}
@media (max-width:26rem){ .brands img{width:3.4rem; height:3.4rem} }
header{padding:clamp(2rem,5vw,3.2rem) 0 0}
.kick{font-family:"IBM Plex Mono",monospace; font-size:.7rem; letter-spacing:.18em;
  text-transform:uppercase; color:var(--accent); font-weight:600}
.sub{margin-top:.55rem; color:var(--ink-2); font-size:.96rem; max-width:56ch}

.total{margin-top:1.8rem; background:var(--surface); border:1px solid var(--line);
  border-radius:5px; padding:1.5rem 1.6rem; box-shadow:var(--shadow);
  display:flex; align-items:flex-end; gap:2.4rem; flex-wrap:wrap}
.total .main{display:flex; flex-direction:column}
.total .lb{font-family:"IBM Plex Mono",monospace; font-size:.7rem; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-3); font-weight:600}
.total .big{font-family:"IBM Plex Mono",monospace; font-weight:600;
  font-size:clamp(2.6rem,7vw,4rem); line-height:1.05; letter-spacing:-.02em;
  font-variant-numeric:tabular-nums; color:var(--s2)}
.total .unit{font-size:.95rem; color:var(--ink-3); font-weight:400; margin-left:.4rem}
.total .hrs{margin-top:.15rem; font-size:.88rem; color:var(--ink-3)}
.total .side{display:flex; gap:2rem; flex-wrap:wrap; padding-bottom:.3rem}
.total .side div{display:flex; flex-direction:column}
.total .side .v{font-family:"IBM Plex Mono",monospace; font-size:1.4rem; font-weight:600;
  font-variant-numeric:tabular-nums; line-height:1.2}

.sechd{margin-top:2.4rem; display:flex; align-items:baseline; justify-content:space-between;
  gap:1rem; flex-wrap:wrap}
.hint{font-size:.83rem; color:var(--ink-3)}
.people{margin-top:1rem; display:grid; gap:.85rem;
  grid-template-columns:repeat(auto-fill,minmax(15rem,1fr))}
.pcard{background:var(--surface); border:1px solid var(--line); border-radius:5px;
  padding:1rem 1.1rem 1.1rem; text-align:left; cursor:pointer; font-family:inherit;
  display:flex; flex-direction:column; gap:.55rem; box-shadow:var(--shadow);
  transition:border-color .12s, transform .12s}
.pcard:hover{border-color:var(--accent); transform:translateY(-1px)}
.pcard:active{transform:none}
.ptop{display:flex; align-items:center; gap:.5rem}
.pname{font-weight:700; font-size:1rem; color:var(--ink); flex:1;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.pmain{display:flex; align-items:baseline; gap:.35rem; margin-top:.15rem}
.pmain .v{font-family:"IBM Plex Mono",monospace; font-weight:600; font-size:2.15rem;
  line-height:1.05; font-variant-numeric:tabular-nums; letter-spacing:-.02em; color:var(--s2)}
.pmain .v.none{color:var(--ink-3); font-size:1.7rem}
.pmain .u{font-size:.8rem; color:var(--ink-3)}
.ptopic{font-size:.86rem; color:var(--ink-2); min-height:1.5rem;
  display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden}
.ptopic.empty{color:var(--ink-3); font-style:italic}
.pcount{font-family:"IBM Plex Mono",monospace; font-size:.72rem; color:var(--ink-3)}
.pbars{display:flex; gap:3px; margin-top:.1rem}
.pbars i{flex:1; height:5px; border-radius:1px; background:var(--line-2); display:block}
.pbars i.on{background:var(--accent)}

.pill{display:inline-flex; align-items:center; font-family:"IBM Plex Mono",monospace;
  font-size:.66rem; font-weight:600; padding:.1rem .42rem; border-radius:2px; white-space:nowrap}
.st0{background:var(--s0-bg); color:var(--s0)}
.st1{background:var(--s1-bg); color:var(--s1)}
.st2{background:var(--s2-bg); color:var(--s2)}

.empty{margin-top:1.4rem; border:1px dashed var(--line-2); border-radius:5px;
  padding:2.4rem 1.4rem; text-align:center; color:var(--ink-3)}

/* ── 第二層 ── */
.back{position:fixed; inset:0; background:rgba(20,20,18,.55); z-index:40;
  display:flex; align-items:flex-start; justify-content:center; padding:1.2rem; overflow-y:auto;
  backdrop-filter:blur(2px)}
.sheet{background:var(--ground); border:1px solid var(--line); border-radius:6px;
  width:100%; max-width:40rem; box-shadow:var(--shadow-lg); margin:auto 0;
  display:flex; flex-direction:column}
.shd{display:flex; align-items:center; gap:.7rem; padding:1rem 1.2rem;
  border-bottom:1px solid var(--line); position:sticky; top:0; z-index:2;
  background:var(--ground); border-radius:6px 6px 0 0}
.shd input.nm{flex:1; font-weight:700; font-size:1.05rem}
.x{background:none; border:1px solid var(--line); color:var(--ink-2); cursor:pointer;
  border-radius:3px; width:2rem; height:2rem; font-size:1rem; line-height:1; flex:none}
.x:hover{border-color:var(--accent); color:var(--accent)}
.sbody{padding:1.1rem 1.2rem; display:flex; flex-direction:column; gap:1.1rem}

.pertop{background:var(--surface); border:1px solid var(--line); border-radius:5px;
  padding:.85rem 1rem; display:flex; flex-direction:column; gap:.6rem}
.pertop .lb{font-family:"IBM Plex Mono",monospace; font-size:.7rem; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-3); font-weight:600}
.sumline{display:flex; align-items:baseline; gap:.4rem}
.sumline .v{font-family:"IBM Plex Mono",monospace; font-weight:600; font-size:1.6rem;
  font-variant-numeric:tabular-nums; color:var(--s2)}
.sumline .v.none{color:var(--ink-3); font-size:1.2rem}
.sumline .u{font-size:.82rem; color:var(--ink-3)}

/* 一件事 */
.item{background:var(--surface); border:1px solid var(--line); border-radius:5px;
  display:flex; flex-direction:column; overflow:hidden}
.ihd{display:flex; align-items:center; gap:.6rem; padding:.6rem .9rem;
  background:var(--surface-2); border-bottom:1px solid var(--line)}
.ihd .n{font-family:"IBM Plex Mono",monospace; font-size:.7rem; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-3); font-weight:600; flex:1}
.ibody{padding:.9rem; display:flex; flex-direction:column; gap:.85rem}
.idel{background:none; border:none; color:var(--ink-3); cursor:pointer; font-size:.72rem;
  font-family:"IBM Plex Mono",monospace; padding:.2rem .35rem; border-radius:2px}
.idel:hover{color:var(--s1); background:var(--ground)}

.calc{border:1px solid var(--line); border-radius:4px; overflow:hidden; background:var(--ground)}
.calc .cr{display:grid; grid-template-columns:3.4rem 1fr auto; gap:.6rem; align-items:center;
  padding:.55rem .8rem; border-bottom:1px solid var(--line); font-size:.88rem}
.calc .cr:last-child{border-bottom:none}
.calc .cl{color:var(--ink-3); font-family:"IBM Plex Mono",monospace; font-size:.75rem}
.calc .ce{color:var(--ink-2); font-family:"IBM Plex Mono",monospace; font-size:.8rem;
  font-variant-numeric:tabular-nums}
.calc .cv{font-family:"IBM Plex Mono",monospace; font-weight:600; font-variant-numeric:tabular-nums;
  white-space:nowrap; font-size:.92rem}
.calc .res{background:var(--s2-bg)}
.calc .res .cl,.calc .res .ce{color:var(--s2); opacity:.85}
.calc .res .cv{color:var(--s2); font-size:1.15rem}
.calc .miss{color:var(--ink-3); font-size:.84rem; padding:.7rem .8rem; line-height:1.6}
.calc .note{padding:.45rem .8rem; border-top:1px solid var(--line); color:var(--ink-3);
  font-size:.74rem; background:var(--surface-2)}

/* 四標準：四個勾選，各帶一句白話判準 */
.crit{display:flex; flex-direction:column; gap:.3rem}
.critline{display:flex; gap:.5rem; align-items:flex-start; cursor:pointer;
  padding:.32rem .45rem; border-radius:3px; line-height:1.5}
.critline:hover{background:var(--ground)}
.critline input{flex:none; margin:.32rem 0 0; width:1rem; height:1rem; accent-color:var(--accent); cursor:pointer}
.critline b{font-weight:700; font-size:.86rem; color:var(--ink); white-space:nowrap}
.critline span{font-size:.84rem; color:var(--ink-3)}
.critsum{margin-top:.15rem; font-family:"IBM Plex Mono",monospace; font-size:.76rem;
  color:var(--ink-3); padding-left:.45rem}
.critsum.full{color:var(--s2); font-weight:600}
.critsum.warn{color:var(--s1)}
.noblk{display:flex; gap:.5rem; align-items:center; cursor:pointer; font-size:.85rem;
  color:var(--ink-3); padding:.2rem .45rem; border-radius:3px}
.noblk:hover{background:var(--ground)}
.noblk input{flex:none; margin:0; width:1rem; height:1rem; accent-color:var(--accent); cursor:pointer}
textarea.off{display:none}

/* 缺數字彙整 */
.needs{margin-top:1.6rem; background:var(--surface); border:1px solid var(--line);
  border-radius:5px; overflow:hidden}
.needs > summary{cursor:pointer; padding:.85rem 1.1rem; font-weight:700; font-size:.95rem;
  display:flex; align-items:center; gap:.6rem; list-style:none; user-select:none}
.needs > summary::-webkit-details-marker{display:none}
.needs > summary::before{content:"▸"; color:var(--accent); font-size:.8rem; transition:transform .12s}
.needs[open] > summary::before{transform:rotate(90deg)}
.needs > summary:hover{background:var(--surface-2)}
.needs .cnt{font-family:"IBM Plex Mono",monospace; font-size:.72rem; color:var(--ink-3); font-weight:400}
.needs .body{border-top:1px solid var(--line); padding:.9rem 1.1rem 1.1rem}
.needs .why{font-size:.85rem; color:var(--ink-3); line-height:1.65; margin-bottom:.8rem}
.nlist{display:flex; flex-direction:column; gap:1px; background:var(--line);
  border:1px solid var(--line); border-radius:4px; overflow:hidden}
.nrow{background:var(--surface); padding:.65rem .85rem; display:grid;
  grid-template-columns:7rem 1fr; gap:.8rem; align-items:baseline; font-size:.9rem}
.nrow .who{font-weight:700; color:var(--ink); font-size:.86rem;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.nrow .who small{display:block; font-weight:400; color:var(--ink-3); font-size:.74rem}
.nrow .what{color:var(--ink-2); line-height:1.6}
@media(max-width:32rem){.nrow{grid-template-columns:1fr; gap:.2rem}}
.needs .none{color:var(--ink-3); font-size:.9rem; padding:.4rem 0}

/* 分析四格 */
.ana{display:flex; flex-direction:column; gap:.4rem}
.anarow{display:grid; grid-template-columns:4.6rem 1fr; gap:.5rem; align-items:center}
.anarow > span{font-size:.78rem; color:var(--ink-3); font-family:"IBM Plex Mono",monospace}
@media(max-width:30rem){.anarow{grid-template-columns:1fr; gap:.15rem}}
.anaout{margin-top:.5rem; background:var(--s2-bg); border:1px solid var(--line);
  border-left:3px solid var(--s2); border-radius:4px; padding:.6rem .8rem;
  font-size:.9rem; line-height:1.7; color:var(--ink-2)}
.anaout b{color:var(--s2)}
.anamiss{margin-top:.5rem; color:var(--ink-3); font-size:.83rem; line-height:1.6}
.anaflag{font-family:"IBM Plex Mono",monospace; font-size:.68rem; padding:.05rem .35rem;
  border-radius:2px; background:var(--s2-bg); color:var(--s2); font-weight:600}
.rejn{font-family:"IBM Plex Mono",monospace; font-size:.66rem; color:var(--s1);
  background:var(--s1-bg); padding:.05rem .35rem; border-radius:2px; font-weight:600}

/* 審核 */
.rv{display:inline-flex; align-items:center; gap:.25rem; font-family:"IBM Plex Mono",monospace;
  font-size:.66rem; font-weight:600; padding:.1rem .42rem; border-radius:2px; white-space:nowrap}
.rv-draft{background:var(--s0-bg); color:var(--s0)}
.rv-pending{background:var(--accent-soft); color:var(--accent)}
.rv-approved{background:var(--s2-bg); color:var(--s2)}
.rv-rejected{background:var(--crit-bg,#F7E4E0); color:var(--crit,#963226)}
.item.locked .ibody{opacity:.72}
.rejbox{background:var(--crit-bg,#F7E4E0); border:1px solid var(--line);
  border-left:3px solid var(--crit,#963226); border-radius:4px; padding:.6rem .8rem;
  font-size:.87rem; color:var(--ink-2); line-height:1.6}
.rejbox b{color:var(--crit,#963226); font-family:"IBM Plex Mono",monospace;
  font-size:.68rem; letter-spacing:.1em; text-transform:uppercase; display:block; margin-bottom:.25rem}
.ifoot{display:flex; gap:.5rem; align-items:center; flex-wrap:wrap;
  padding:.7rem .9rem; border-top:1px solid var(--line); background:var(--surface-2)}
.ifoot .msg{font-size:.8rem; color:var(--ink-3)}
button.mini{font-family:inherit; font-size:.82rem; font-weight:700; cursor:pointer;
  border-radius:3px; padding:.35rem .8rem; border:1px solid var(--accent);
  background:var(--accent); color:var(--ground)}
button.mini.ghost{background:var(--surface); color:var(--accent)}
button.mini.no{border-color:var(--crit,#963226); background:var(--surface); color:var(--crit,#963226)}
button.mini[disabled]{opacity:.5; cursor:default}
.pend{margin-top:1.1rem; background:var(--accent-soft); border:1px solid var(--line);
  border-left:3px solid var(--accent); border-radius:4px; padding:.75rem 1rem;
  display:flex; align-items:center; gap:.8rem; flex-wrap:wrap; font-size:.9rem}
.pend b{font-family:"IBM Plex Mono",monospace; font-size:1.1rem; color:var(--accent)}
.rvbtn{margin-left:auto}
.pflag{font-family:"IBM Plex Mono",monospace; font-size:.68rem; padding:.05rem .35rem;
  border-radius:2px; background:var(--accent-soft); color:var(--accent); font-weight:600}
.pflag.rej{background:var(--crit-bg,#F7E4E0); color:var(--crit,#963226)}

.fld{display:grid; grid-template-columns:5.2rem 1fr; gap:.6rem; align-items:center}
.fld > label{font-size:.77rem; color:var(--ink-3); font-family:"IBM Plex Mono",monospace; align-self:start; padding-top:.35rem}
.fld.mid > label{align-self:center; padding-top:0}
@media(max-width:32rem){.fld{grid-template-columns:1fr; gap:.2rem}}

input[type=text], input[type=number], input[type=date], select, textarea{
  width:100%; font-family:inherit; font-size:.92rem; color:var(--ink);
  background:var(--ground); border:1px solid var(--line); border-radius:3px;
  padding:.4rem .6rem; line-height:1.5}
.sheet input, .sheet select, .sheet textarea{background:var(--ground)}
.item input, .item select, .item textarea{background:var(--surface-2)}
input:focus, select:focus, textarea:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent)}
input[type=number]{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums}
textarea{resize:vertical; min-height:2.6rem}
.mins{display:flex; align-items:center; gap:.4rem; flex-wrap:wrap; font-size:.85rem; color:var(--ink-3)}
.mins input{width:4.4rem}

.sess{display:flex; gap:.3rem; flex-wrap:wrap}
.sess button{width:2.1rem; height:2.1rem; border-radius:3px; border:1px solid var(--line);
  background:var(--ground); color:var(--ink-3); cursor:pointer;
  font-family:"IBM Plex Mono",monospace; font-size:.72rem; font-weight:600}
.sess button.on{background:var(--accent); border-color:var(--accent); color:var(--ground)}
.sess button:hover{border-color:var(--accent)}

.additem{background:var(--surface); border:1px dashed var(--line-2); color:var(--accent);
  border-radius:5px; padding:.7rem; cursor:pointer; font-family:inherit;
  font-size:.88rem; font-weight:700}
.additem:hover{border-color:var(--accent); background:var(--accent-soft)}
.additem[disabled]{opacity:.5; cursor:default}

.sfoot{display:flex; gap:.6rem; align-items:center; flex-wrap:wrap;
  padding:.9rem 1.2rem; border-top:1px solid var(--line); position:sticky; bottom:0;
  background:var(--ground); border-radius:0 0 6px 6px}
.del{background:none; border:none; color:var(--ink-3); cursor:pointer; font-size:.8rem;
  font-family:"IBM Plex Mono",monospace; padding:.3rem .4rem; border-radius:2px; margin-left:auto}
.del:hover{color:var(--s1); background:var(--surface-2)}

.bar{position:sticky; bottom:0; z-index:10; margin-top:2.2rem; padding:.9rem 0 1rem;
  background:linear-gradient(to top, var(--ground) 74%, transparent);
  display:flex; gap:.6rem; align-items:center; flex-wrap:wrap}
button.act{font-family:inherit; font-size:.88rem; font-weight:700; cursor:pointer;
  border-radius:3px; padding:.5rem .95rem; border:1px solid var(--accent);
  background:var(--accent); color:var(--ground)}
button.act.ghost{background:var(--surface); color:var(--accent)}
button.act[disabled]{opacity:.5; cursor:default}
.note{font-size:.82rem; color:var(--ink-3)}
.note.warn{color:var(--s1)}
.note.ok{color:var(--s2)}

  function esc(t){ return String(t==null?'':t).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function num(v){ var n=parseFloat(v); return isFinite(n)&&n>=0?n:null; }
  function fmt(n){ return Number(n).toLocaleString('en-US'); }
  function uid(pre){ seq++; return pre+Date.now().toString(36)+seq.toString(36); }

  /* 舊格式（一人一件）自動轉成 items[]，不會弄丟已填的資料 */
  function migrate(){
    // 舊的八堂進度 → 四堂 ＋ 展示格（取前四堂，第五格是 10/07 展示）
    S.people.forEach(function(p){
      if(!Array.isArray(p.sess)) p.sess=[false,false,false,false,false];
      if(p.sess.length!==5){
        var old=p.sess.slice(0,4);
        while(old.length<4) old.push(false);
        p.sess=old.concat([false]);
      }
    });
    S.people.forEach(function(p){
      if(Array.isArray(p.items)) return;
      p.items=[{ id:uid('i'), topic:p.topic||'', criteria:p.criteria||'', crit:null,
        beforeMin:p.beforeMin||'', perWeek:p.perWeek||'', afterMin:p.afterMin||'',
        status:p.status||0, lastUsed:p.lastUsed||'', blocker:p.blocker||'', needData:p.needData||'' }];
      ['topic','criteria','beforeMin','perWeek','afterMin','status','lastUsed','blocker','needData']
        .forEach(function(k){ delete p[k]; });
    });
    // 欄位補齊：舊的「符合 N 項」轉成前 N 項打勾（正式版尚無資料，這條只為保險）
    S.people.forEach(function(p){
      (p.items||[]).forEach(function(it){
        if(!Array.isArray(it.crit)){
          var n=parseInt(it.criteria,10); if(!isFinite(n)||n<0) n=0; if(n>4) n=4;
          it.crit=[0,1,2,3].map(function(k){ return k<n; });
        }
        delete it.criteria;
        if(typeof it.noBlocker!=='boolean') it.noBlocker=false;
        // 既有資料視為已通過（它本來就秀在看板上了）；新建的一律從 draft 開始
        if(!it.review) it.review = 'approved';
        if(typeof it.rejectNote!=='string') it.rejectNote='';
        if(!it.ana || typeof it.ana!=='object') it.ana={b:'',t:'',w:'',n:''};
        if(typeof it.rejectCount!=='number') it.rejectCount=0;
      });
    });
  }
  migrate();

  var CRIT=[
    ['高頻','這件事我一週至少做 3 次'],
    ['可標準化','每次的步驟都差不多，不是每次都不一樣'],
    ['可驗收','AI 做出來的東西對不對，我自己看得出來'],
    ['風險低','就算 AI 做錯，我發出去之前會發現，不會直接出事']
  ];
  // 審核狀態：draft 還沒送 ／ pending 等審核 ／ approved 已通過（才計入數字）／ rejected 被退回
  var REVIEW={draft:'還沒送審', pending:'等審核', approved:'已通過', rejected:'被退回'};
  // 分析四格（第 01 堂就教，四堂每週更新）：因為＿所以＿，本週先做＿，下週看＿
  var ANA=[
    ['b','因為',  '你看到的事實，最好有數字'],
    ['t','所以',  '你的判斷——這代表什麼'],
    ['w','本週先做','一個具體動作，這週做得完的'],
    ['n','下週看', '一個可以驗證的數字']
  ];
  function newItem(){ return {id:uid('i'), topic:'', crit:[false,false,false,false],
    beforeMin:'', perWeek:'', afterMin:'', status:0, lastUsed:'',
    blocker:'', noBlocker:false, needData:'',
    ana:{b:'',t:'',w:'',n:''}, review:'draft', rejectNote:'', rejectCount:0}; }
  function anaFilled(it){
    var a=it.ana||{}; var n=0;
    ANA.forEach(function(x){ if(String(a[x[0]]||'').trim()) n++; });
    return n;
  }
  function hasAnalysis(p){
    var n=0;
    (p.items||[]).forEach(function(it){ if(isApproved(it)&&anaFilled(it)===4) n++; });
    return n;
  }
  function critCount(it){ var n=0; (it.crit||[]).forEach(function(x){ if(x) n++; }); return n; }
  function newPerson(){ return {id:uid('p'), name:'',
    sess:[false,false,false,false,false], items:[newItem()]}; }
  function find(id){ for(var i=0;i<S.people.length;i++) if(S.people[i].id===id) return S.people[i]; return null; }
  function findItem(p,iid){ for(var i=0;i<p.items.length;i++) if(p.items[i].id===iid) return p.items[i]; return null; }

  function calc(it){
    var b=num(it.beforeMin), a=num(it.afterMin), w=num(it.perWeek);
    if(b===null||w===null) return null;
    var before=b*w*WPM;
    if(a===null) return {partial:true, before:Math.round(before), b:b, w:w};
    var after=a*w*WPM;
    return {partial:false, b:b, a:a, w:w, before:Math.round(before), after:Math.round(after),
      saved:Math.max(Math.round(before)-Math.round(after),0)};
  }
  function itemSaved(it){ var c=calc(it); return (c&&!c.partial)?c.saved:null; }
  function isApproved(it){ return it.review==='approved'; }
  // 只有審核通過的才計入數字
  function personSaved(p){
    var t=null;
    (p.items||[]).forEach(function(it){
      if(!isApproved(it)) return;
      var s=itemSaved(it); if(s!==null) t=(t===null?0:t)+s;
    });
    return t;
  }
  function personStatus(p){
    var m=0; (p.items||[]).forEach(function(it){
      if(!isApproved(it)) return;
      if((it.status||0)>m) m=it.status||0; }); return m;
  }
  function filledItems(p){ var n=0; (p.items||[]).forEach(function(it){
    if(isApproved(it) && itemSaved(it)!==null) n++; }); return n; }
  function approvedCount(p){ var n=0; (p.items||[]).forEach(function(it){ if(isApproved(it)) n++; }); return n; }
  function pendingCount(p){ var n=0; (p.items||[]).forEach(function(it){ if(it.review==='pending') n++; }); return n; }
  function rejectedCount(p){ var n=0; (p.items||[]).forEach(function(it){ if(it.review==='rejected') n++; }); return n; }
  function allPending(){ var n=0; S.people.forEach(function(p){ n+=pendingCount(p); }); return n; }
  function allRejected(){ var n=0; S.people.forEach(function(p){ n+=rejectedCount(p); }); return n; }

  /* ─────────── 第一層 ─────────── */
  function totalHtml(){
    var tot=0, ppl=0, inUse=0, done=0, maxS=0, items=0, ana=0;
    S.people.forEach(function(p){
      var s=personSaved(p);
      if(s!==null){ tot+=s; ppl++; }
      var st=personStatus(p);
      if(st===2) inUse++;
      if(st>=1) done++;
      items+=approvedCount(p);
      if(hasAnalysis(p)>0) ana++;
      var c=0; (p.sess||[]).slice(0,4).forEach(function(x){ if(x) c++; });
      if(c>maxS) maxS=c;
    });
    return '<div class="total"><div class="main">'+
      '<span class="lb">全班每月共省下</span>'+
      '<span class="big">'+(tot?fmt(tot):'—')+'<span class="unit">分鐘</span></span>'+
      '<span class="hrs">'+(tot?('≈ '+(tot/60).toFixed(1)+' 小時／月　·　'+ppl+'/'+S.people.length+' 人有通過的資料')
                              :'還沒有通過審核的資料')+'</span></div>'+
      '<div class="side">'+
        '<div><span class="lb">在用</span><span class="v">'+inUse+' <span class="unit">人</span></span></div>'+
        '<div><span class="lb">做出來以上</span><span class="v">'+done+' <span class="unit">人</span></span></div>'+
        '<div><span class="lb">已通過的事</span><span class="v">'+items+' <span class="unit">件</span></span></div>'+
        '<div><span class="lb" title="有沒有填，不是填得好不好；品質看退回次數">分析填好的</span><span class="v">'+ana+' <span class="unit">/ '+S.people.length+' 人</span></span></div>'+
        '<div><span class="lb">進度最前</span><span class="v">'+maxS+' <span class="unit">/ 4 堂</span></span></div>'+
      '</div></div>';
  }

  function pendHtml(){
    var np=allPending(), nr=allRejected();

      return '<div class="pend"><b>'+np+'</b> 件等你審核'+

  function peopleHtml(){
    if(!S.people.length) return '<div class="empty">還沒有人。按下面「＋ 新增學員」把 16 個人加進來。</div>';
    return '<div class="people">'+S.people.map(function(p,i){

          : '<span class="v">'+fmt(s)+'</span><span class="u">分鐘 / 月</span>')+'</span>'+
        '<span class="ptopic'+(first?'':' empty')+'">'+topicLine+'</span>'+
        '<span class="pbars">'+bars+'</span></button>';
    }).join('')+'</div>';
  }

  function needsHtml(){
    var rows=[];
    S.people.forEach(function(p){
      (p.items||[]).forEach(function(it){
        var t=String(it.needData||'').trim();
        if(t) rows.push({who:p.name||'（未命名）', topic:it.topic||'（還沒定題目）', what:t});
      });

           '當下就寫上來。</div>';

      body='<div class="nlist">'+rows.map(function(r){
        return '<div class="nrow"><span class="who">'+esc(r.who)+
               '<small>'+esc(r.topic)+'</small></span>'+
               '<span class="what">'+esc(r.what)+'</span></div>';
      }).join('')+'</div>';

      '<span class="cnt">'+rows.length+' 筆</span></summary>'+
      '<div class="body"><p class="why">'+
      '學員做分析時撞到的<strong>數據缺口</strong>——這不是他們做不到，是公司沒給他們那個數字。<br>'+
      '<strong>同一個數字有多個人要不到，就是最該優先做的功能。</strong>'+
      '這份清單是 10/07 報告「第二階段要做什麼」那頁的內容。</p>'+
      body+'</div></details>';
  }

  /* 止損檢視：只在審核模式出現——名單不公開，退出審核模式就不見 */
  function riskHtml(){
    if(!reviewMode) return '';
    var talk=[], edge=[], idle=[], ok=[];
    S.people.forEach(function(p){
      var sx=p.sess||[], c=0, i;
      var last='';   // 通過的件裡最晚的「最近用」；空＝一次都沒真的拿來用
      (p.items||[]).forEach(function(it){
        if(!isApproved(it)) return;
        var d=String(it.lastUsed||'').trim();
        if(d && d>last) last=d;
      });
      var r={name:p.name||'（未命名）', c:c, s:sx, show:!!sx[4],
             done:approvedCount(p), last:last};
      for(i=0;i<4;i++) if(sx[i]) c++;
      r.c=c;
      if(!r.show) talk.push(r);
      else if(c<2) edge.push(r);
      else if(!last) idle.push(r);
      else ok.push(r);
    });
    function rows(list){
      return list.map(function(r){
        var d='<span class="dots">'+[0,1,2,3].map(function(i){
              return r.s[i]?'<b>●</b>':'<i>○</i>'; }).join('')+'</span>'+
              '<span class="shown">'+(r.show?'★ 有分享':'☆ 沒分享')+'</span>'+
              '<span class="shown'+(r.last?'':' no')+'">'+
                (r.last?('最近用 '+esc(r.last.slice(5).replace('-','/'))):'沒用過')+'</span>';
        return '<div class="nrow"><span class="who">'+esc(r.name)+
          '<small>通過 '+r.done+' 件</small></span><span class="what">'+d+'</span></div>';
      }).join('');
    }
    function grp(t,note,list){
      return '<div class="grp">'+t+' <em>· '+list.length+' 人'+(note?' · '+note:'')+'</em></div>'+
        (list.length?'<div class="nlist">'+rows(list)+'</div>':'<div class="none">沒有人。</div>');
    }
    return '<details class="needs"><summary>止損檢視（只有你看得到）'+
      '<span class="cnt">'+(talk.length+edge.length+idle.length)+' 人要看一下</span></summary>'+
      '<div class="body"><p class="why">'+
      '判準只看<strong>有沒有交</strong>，不看做得好不好、省了幾分鐘——'+
      '看品質就會變成篩強者，而且會誤傷做得慢但每次都交的人。<br>'+
      '① 四堂有沒有交件通過（●）　② 10/07 有沒有分享（★，現場或線上都算）　'+
      '③ <strong>是不是自己做的</strong>——這格看板記不到，10/07 當場請他跑一次就驗得出來。<br>'+
      '④ <strong>有沒有真的拿來用</strong>——就是總經理 Q6 講的「明顯沒在用」。'+
      '工具跑得出來卻不用，是不想用，一樣是意願不是能力。<br>'+
      '&nbsp;&nbsp;&nbsp;⚠ 下面「沒用過」是<strong>學員自己填的，是篩子不是證據</strong>——沒填跟沒用分不出來。'+
      '<strong>證據是他第 01 堂開的那個資料夾</strong>：10/07 當場打開，看使用期 13 天裡有幾個檔案、日期落在哪。'+
      '這件事第 01 堂就要先講，10/07 才講是埋伏。<br>'+
      '⚠ 結果<strong>一律個別通知，不公開名單</strong>；這個區塊退出審核模式就會消失。</p>'+
      grp('需要談','10/07 沒分享（現場或線上都沒有）',talk)+
      grp('要確認','有分享，但四堂交不到兩堂',edge)+
      grp('做出來了沒在用','四堂有交、10/07 有分享，但「最近用」一次都沒填 → <b>10/07 打開他的資料夾看檔案日期再判斷</b>',idle)+
      grp('照常續','',ok)+
      '</div></details>';
  }

  function render(){
    document.getElementById('root').innerHTML=
      '<header>'+BRANDS+'<span class="kick">鼎兆元 · AI 種子計畫</span><h1>學習看板</h1>'+

      peopleHtml()+

      '欄位對應四堂課流程表：題目與四標準＝第 01 堂／狀態＝第 03–04 堂／'+
      '<strong>時間帳與分析四格＝第 01 堂就填，每週更新</strong>／「拿不到的數字」＝任何一堂撞到就寫。<br>'+
      '分析四格填滿會組成一句完整的話——那是總經理 Q2 要的「看得到怎麼想的過程」。<br>'+
      '⚠ 「分析填好的 N／16」是<strong>有沒有填</strong>，不是填得好不好；品質看的是<strong>退回次數</strong>。</p>';
    document.getElementById('add').addEventListener('click', onAdd);

    var xr=document.getElementById('exitRv');  if(xr) xr.addEventListener('click', function(){

  function enterReview(){

      if(!set){ alert('通行碼不能空白'); return; }
      S.reviewCode=set; reviewMode=true; touch(); render();

  // 學員在 pending／approved 時不能改；審核模式下 Eason 一律可改
  function locked(it){ return !reviewMode && (it.review==='pending' || it.review==='approved'); }

  function itemFootHtml(p,it){
    var d='data-id="'+esc(p.id)+'" data-item="'+esc(it.id)+'"';
    if(reviewMode){
      if(it.review==='pending')
        return '<div class="ifoot"><button class="mini" data-approve="1" '+d+'>通過</button>'+
               '<button class="mini no" data-reject="1" '+d+'>駁回…</button>'+
               '<span class="msg">通過之後這件的數字才會計入看板</span></div>';
      if(it.review==='approved')
        return '<div class="ifoot"><button class="mini ghost" data-unapprove="1" '+d+'>收回通過</button>'+
               '<span class="msg">收回後會從看板數字扣掉，並退回學員修改</span></div>';
      if(it.review==='rejected')
        return '<div class="ifoot"><button class="mini" data-approve="1" '+d+'>直接通過</button>'+
               '<span class="msg">已退回給學員，等他改完重送</span></div>';
      return '<div class="ifoot"><button class="mini ghost" data-approve="1" '+d+'>直接通過</button>'+
             '<span class="msg">學員還沒送審——你自己代填的話可以直接通過</span></div>';
    }
    if(it.review==='pending')
      return '<div class="ifoot"><button class="mini ghost" data-withdraw="1" '+d+'>撤回修改</button>'+
             '<span class="msg">已送出，等 Eason 審核。要改的話先撤回</span></div>';
    if(it.review==='approved')
      return '<div class="ifoot"><button class="mini ghost" data-withdraw="1" '+d+'>我要修改</button>'+
             '<span class="msg">已通過並計入看板。改了要重新送審，期間會先從數字扣掉</span></div>';
    // draft / rejected
    return '<div class="ifoot"><button class="mini" data-submit="1" '+d+'>送出審核</button>'+
           '<span class="msg">送出後 Eason 會看，通過才會算進看板</span></div>';
  }

  function anaHtml(p,it){
    var a='data-id="'+esc(p.id)+'" data-item="'+esc(it.id)+'"';
    var v=it.ana||{}, n=anaFilled(it);
    var rows=ANA.map(function(x){
      return '<div class="anarow"><span>'+esc(x[1])+'</span>'+
        '<input type="text" data-ana="'+x[0]+'" '+a+' value="'+esc(v[x[0]]||'')+'" placeholder="'+esc(x[2])+'"></div>';
    }).join('');
    var out;
    if(n===4){
      out='<div class="anaout"><b>因為</b> '+esc(v.b)+'<b>，所以</b> '+esc(v.t)+
          '<b>，本週先做</b> '+esc(v.w)+'<b>，下週看</b> '+esc(v.n)+'。</div>';
    } else if(n===0){
      out='<div class="anamiss"><strong>從第 01 堂就填，每週跟時間帳一起更新。</strong>'+
        '第 01–02 堂寫的是「我為什麼挑這件事、要看什麼變化」；'+
        '第 03 堂起，改成分析你這週真的做出來的那份產出。<br>'+
        '四格填滿，下面會組成一句完整的話——那就是交出去不會被問「所以呢」的長相。</div>';
    } else {
      out='<div class="anamiss">還差 '+(4-n)+' 格。<strong>四格缺一格，交出去就會被問「所以呢」。</strong></div>';
    }
    return '<div class="ana" data-ana-box="'+esc(it.id)+'">'+rows+out+'</div>';
  }

  function itemHtml(p,it,idx,total){
    var a='data-id="'+esc(p.id)+'" data-item="'+esc(it.id)+'"';
    var lk=locked(it);
    var rv=it.review||'draft';
    return '<div class="item'+(lk?' locked':'')+'" id="it-'+esc(it.id)+'">'+
      '<div class="ihd"><span class="n">第 '+(idx+1)+' 件'+(total>1?('／共 '+total+' 件'):'')+'</span>'+
        '<span class="rv rv-'+rv+'" data-rvpill="'+esc(it.id)+'">'+REVIEW[rv]+'</span>'+
        (anaFilled(it)===4?'<span class="anaflag" title="四格分析已填滿">分析 ✓</span>':'')+
        (it.rejectCount?'<span class="rejn" title="被退回過的次數">退回 '+it.rejectCount+'</span>':'')+
        '<span class="pill st'+(it.status||0)+'" data-ipill="'+esc(it.id)+'">'+STATUS[it.status||0]+'</span>'+
        (total>1&&!lk?'<button class="idel" data-delitem="'+esc(it.id)+'" data-id="'+esc(p.id)+'">移除這件</button>':'')+
      '</div>'+
      '<div class="ibody">'+
        (rv==='rejected'&&it.rejectNote
          ? '<div class="rejbox"><b>被退回的原因</b>'+esc(it.rejectNote)+'</div>' : '')+
        '<div data-calc="'+esc(it.id)+'">'+calcHtml(it)+'</div>'+
        fld('題目','<input type="text" data-f="topic" '+a+' value="'+esc(it.topic)+'" placeholder="每週重複三次以上、最煩的那件事">')+
        fld('四標準','<div class="crit" data-crit-box="'+esc(it.id)+'">'+critHtml(p,it)+'</div>')+
        fld('原本','<span class="mins">每次 <input type="number" min="0" data-f="beforeMin" '+a+' value="'+esc(it.beforeMin)+'"> 分 × 每週 <input type="number" min="0" data-f="perWeek" '+a+' value="'+esc(it.perWeek)+'"> 次</span>')+
        fld('現在','<span class="mins">每次 <input type="number" min="0" data-f="afterMin" '+a+' value="'+esc(it.afterMin)+'"> 分</span>')+
        fld('狀態','<select data-f="status" '+a+'>'+
          opt('0','未開始',String(it.status||0))+opt('1','做出來了',String(it.status||0))+opt('2','在用',String(it.status||0))+'</select>')+
        fld('最近用','<input type="date" data-f="lastUsed" '+a+' value="'+esc(it.lastUsed)+'">'+
            '<div class="hintline">每真的用一次就改成當天。10/07 會對照你資料夾裡的檔案日期。</div>')+
        fld('卡點','<div data-blk-box="'+esc(it.id)+'">'+blkHtml(p,it)+'</div>')+
        fld('缺數字','<textarea data-f="needData" '+a+' placeholder="我需要但拿不到的數字（任何一堂撞到就寫）">'+esc(it.needData)+'</textarea>')+
        fld('分析', anaHtml(p,it))+
      '</div>'+ itemFootHtml(p,it) +'</div>';
  }

  function sumHtml(p){
    var s=personSaved(p), n=(p.items||[]).length, f=filledItems(p);
    return '<span class="lb">這個人每月共省下</span>'+
      '<span class="sumline">'+(s===null
        ? '<span class="v none">—</span><span class="u">還沒填完任何一件</span>'
        : '<span class="v">'+fmt(s)+'</span><span class="u">分鐘 / 月　·　'+f+'/'+n+' 件已填完</span>')+'</span>';
  }

  function sheetHtml(p){
    var n=(p.items||[]).length;
    return '<div class="back" id="back"><div class="sheet" role="dialog" aria-modal="true" aria-label="學員細項">'+
      '<div class="shd">'+
        '<input class="nm" type="text" data-f="name" data-id="'+esc(p.id)+'" value="'+esc(p.name)+'" placeholder="姓名" aria-label="姓名">'+
        '<button class="x" id="closeX" aria-label="關閉">✕</button></div>'+
      '<div class="sbody">'+
        '<div class="pertop" id="perTop">'+sumHtml(p)+
          '<div><span class="lb" style="display:block;margin-bottom:.35rem">四堂進度 ＋ ★ 10/07 分享'+
            (reviewMode?'（你可以改）':'（由 Eason 確認當堂交件後才勾）')+'</span>'+
          '<span class="sess">'+LESSONS.map(function(l,k){
            return '<button data-sess="'+esc(p.id)+'" data-k="'+k+'" class="'+((p.sess&&p.sess[k])?'on':'')+'"'+
              (reviewMode?'':' disabled')+' title="'+(k<4?('第 '+l+' 堂交件通過'):'10/07 成果分享（現場或線上都算）')+'">'+l+'</button>';
          }).join('')+'</span></div>'+
        '</div>'+
        p.items.map(function(it,i){ return itemHtml(p,it,i,n); }).join('')+
        '<button class="additem" id="addItem" data-id="'+esc(p.id)+'">＋ 再加一件事</button>'+
      '</div>'+
      '<div class="sfoot">'+
        '<button class="act" id="doneBtn">完成並存檔</button>'+
        '<span class="note" id="sMsg"></span>'+
        '<button class="del" data-del="'+esc(p.id)+'">移除這個人</button>'+
      '</div></div></div>';
  }

  function openSheet(id, focusItemId){
    var p=find(id); if(!p) return;
    openId=id;
    document.getElementById('layer').innerHTML=sheetHtml(p);
    if(canWrite===false){
      document.querySelectorAll('#layer input,#layer select,#layer textarea,#layer .sess button,#layer .del,#layer .idel,#layer .additem,#layer .mini')
        .forEach(function(x){ x.disabled=true; });
      var sm=document.getElementById('sMsg'); if(sm) sm.textContent='唯讀模式，改不了';
    } else {
      // 送審中／已通過的件，學員不能改（審核模式除外）
      (p.items||[]).forEach(function(it){
        if(!locked(it)) return;
        var box=document.getElementById('it-'+it.id);
        if(box) box.querySelectorAll('input,select,textarea').forEach(function(x){ x.disabled=true; });
      });
    }
    document.getElementById('closeX').addEventListener('click', closeSheet);
    document.getElementById('doneBtn').addEventListener('click', onDone);
    document.getElementById('back').addEventListener('mousedown', function(e){
      if(e.target && e.target.id==='back') closeSheet();
    });
    var ai=document.getElementById('addItem');
    if(ai) ai.addEventListener('click', function(){
      var pp=find(this.getAttribute('data-id')); if(!pp) return;
      var it=newItem(); pp.items.push(it); touch(); openSheet(pp.id, it.id);
    });
    var target = focusItemId
      ? document.querySelector('#layer [data-item="'+focusItemId+'"][data-f="topic"]')
      : document.querySelector('#layer [data-f="name"]');
    if(target && !target.disabled){
      try{ target.focus(); }catch(e){}
      if(focusItemId){ var box=document.getElementById('it-'+focusItemId);
        if(box) box.scrollIntoView({block:'center'}); }
    }
  }
  function closeSheet(){ openId=null; document.getElementById('layer').innerHTML=''; render(); }
  document.addEventListener('keydown', function(e){ if(e.key==='Escape'&&openId) closeSheet(); });

  function onDone(){
    var b=this;
    if(canWrite===false || !dirty){ closeSheet(); return; }
    b.disabled=true; b.textContent='存檔中…';
    saveNow(function(ok,message,cls){
      if(ok){ closeSheet(); return; }
      b.disabled=false; b.textContent='完成並存檔';
      var sm=document.getElementById('sMsg');
      if(sm){ sm.textContent=message; sm.className='note '+(cls||'warn'); }
    });
  }

  function refreshItem(pid,iid){
    var p=find(pid); if(!p) return;
    var it=findItem(p,iid); if(!it) return;
    var cb=document.querySelector('[data-calc="'+iid+'"]'); if(cb) cb.innerHTML=calcHtml(it);
    var pl=document.querySelector('[data-ipill="'+iid+'"]');
    if(pl){ pl.className='pill st'+(it.status||0); pl.textContent=STATUS[it.status||0]; }
    var top=document.getElementById('perTop');
    if(top){ var sess=top.querySelector('div'); var keep=sess?sess.outerHTML:'';
      top.innerHTML=sumHtml(p)+keep; }
  }

  /* ─────────── 事件 ─────────── */
  document.addEventListener('change', function(e){
    var t=e.target; if(!t.getAttribute) return;
    var pid=t.getAttribute('data-id'), iid=t.getAttribute('data-item');
    if(!pid||!iid) return;
    var p=find(pid); if(!p) return;
    var it=findItem(p,iid); if(!it) return;
    if(t.hasAttribute('data-crit')){
      var k=parseInt(t.getAttribute('data-crit'),10);
      if(!Array.isArray(it.crit)) it.crit=[false,false,false,false];
      it.crit[k]=t.checked; touch();
      var box=document.querySelector('[data-crit-box="'+iid+'"]');
      if(box) box.innerHTML=critHtml(p,it);
    } else if(t.hasAttribute('data-noblk')){
      it.noBlocker=t.checked;
      if(t.checked) it.blocker='';
      touch();
      var bb=document.querySelector('[data-blk-box="'+iid+'"]');
      if(bb) bb.innerHTML=blkHtml(p,it);
    }
  });

  document.addEventListener('input', function(e){
    var t=e.target; if(!t.getAttribute) return;
    var pid=t.getAttribute('data-id');
    // 分析四格
    var ak=t.getAttribute('data-ana');
    if(pid && ak){
      var pa=find(pid); if(!pa) return;
      var ia=findItem(pa, t.getAttribute('data-item')); if(!ia) return;
      if(!ia.ana) ia.ana={b:'',t:'',w:'',n:''};
      ia.ana[ak]=t.value; touch();
      // 只重畫下方的組合句，不重畫輸入框（避免游標跳走）
      var box=document.querySelector('[data-ana-box="'+ia.id+'"]');
      if(box){
        var old=box.querySelector('.anaout, .anamiss');
        var tmp=document.createElement('div');
        tmp.innerHTML=anaHtml(pa,ia);
        var neu=tmp.querySelector('.anaout, .anamiss');
        if(old&&neu) old.replaceWith(neu);
      }
      var hd=document.querySelector('[data-rvpill="'+ia.id+'"]');
      if(hd){
        var flag=hd.parentNode.querySelector('.anaflag');
        if(anaFilled(ia)===4 && !flag){
          var sp=document.createElement('span'); sp.className='anaflag'; sp.textContent='分析 ✓';
          hd.after(sp);
        } else if(anaFilled(ia)!==4 && flag){ flag.remove(); }
      }
      var kp=document.querySelector('.total'); if(kp) kp.outerHTML=totalHtml();
      return;
    }
    var f=t.getAttribute('data-f');
    if(!pid||!f) return;
    var p=find(pid); if(!p) return;
    var iid=t.getAttribute('data-item');
    if(iid){
      var it=findItem(p,iid); if(!it) return;
      it[f]=(f==='status')?(parseInt(t.value,10)||0):t.value;
      touch(); refreshItem(pid,iid);
    } else {
      p[f]=t.value; touch();
    }
  });

  document.addEventListener('click', function(e){
    var t=e.target && e.target.closest ? e.target.closest('[data-open],[data-sess],[data-del],[data-delitem],[data-submit],[data-approve],[data-reject],[data-withdraw],[data-unapprove]') : null;
    if(!t) return;
    if(t.hasAttribute('data-open')){ openSheet(t.getAttribute('data-open')); }
    else if(t.hasAttribute('data-sess')){
      if(!reviewMode) return;           // 四堂進度只有審核模式能改
      var p=find(t.getAttribute('data-sess')); if(!p) return;
      var k=parseInt(t.getAttribute('data-k'),10);
      if(!Array.isArray(p.sess)) p.sess=[false,false,false,false,false];
      p.sess[k]=!p.sess[k]; t.className=p.sess[k]?'on':''; touch();
    }
    else if(t.hasAttribute('data-submit')||t.hasAttribute('data-approve')||
            t.hasAttribute('data-reject')||t.hasAttribute('data-withdraw')||
            t.hasAttribute('data-unapprove')){
      var pp=find(t.getAttribute('data-id')); if(!pp) return;
      var ii=findItem(pp,t.getAttribute('data-item')); if(!ii) return;
      if(t.hasAttribute('data-submit')){
        if(!ii.topic || String(ii.topic).trim()===''){ alert('先填「題目」再送審'); return; }
        ii.review='pending'; ii.rejectNote='';
      } else if(t.hasAttribute('data-approve')){
        ii.review='approved'; ii.rejectNote='';
      } else if(t.hasAttribute('data-reject')){
        var why=prompt('退回原因（學員會看到這句話）：', ii.rejectNote||'');
        if(why===null) return;
        why=String(why).trim();
        if(!why){ alert('要寫原因，不然學員不知道要改什麼'); return; }
        ii.review='rejected'; ii.rejectNote=why;
        ii.rejectCount=(ii.rejectCount||0)+1;
      } else if(t.hasAttribute('data-withdraw')||t.hasAttribute('data-unapprove')){
        ii.review='draft';
      }
      touch(); openSheet(pp.id);
      return;
    }
    else if(t.hasAttribute('data-delitem')){
      var p2=find(t.getAttribute('data-id')); if(!p2) return;
      var iid=t.getAttribute('data-delitem'), it=findItem(p2,iid); if(!it) return;
      if(p2.items.length<=1) return;
      if(!confirm('移除「'+(it.topic||'這件事')+'」？這件的資料會不見。')) return;
      p2.items=p2.items.filter(function(x){ return x.id!==iid; });
      touch(); openSheet(p2.id);
    }
    else if(t.hasAttribute('data-del')){
      var id=t.getAttribute('data-del'), p3=find(id); if(!p3) return;
      if(!confirm('移除「'+(p3.name||'這位學員')+'」？他填的資料會不見。')) return;
      S.people=S.people.filter(function(x){ return x.id!==id; });
      touch(); closeSheet();
    }
  });

  function onAdd(){ var p=newPerson(); S.people.push(p); touch(); render(); openSheet(p.id); }

  /* ─────────── 存檔 ─────────── */
  var SHELL_HEAD='<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">'+
    '<meta name="viewport" content="width=device-width,initial-scale=1">'+
    '<title>學習看板 示範版</title>'+
    '<link rel="preconnect" href="https://fonts.googleapis.com">'+
    '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>'+
    '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">';

  function buildDoc(state){
    var css=document.getElementById('css').textContent;
    var js =document.getElementById('logic').textContent;
    var json=JSON.stringify(state).replace(/<\//g,'<\\/');
    return SHELL_HEAD+'<style id="css">'+css+'</style>'+
      '<script type="application\/json" id="state">'+json+'<\/script>'+
      '</head><body><div class="wrap" id="root"></div><div id="layer"></div>'+
      '<script id="logic">'+js+'<\/script></body></html>';
  }

  function saveNow(cb){
    if(saving){ cb(false,'存檔中，等一下','warn'); return; }
    if(canWrite===false){ cb(false,'你是唯讀模式，改不了','warn'); return; }
    if(!artifact){ cb(false,'連線還沒好，等幾秒再按','warn'); return; }
    saving=true; S.rev=(S.rev||0)+1;
    artifact.publish(buildDoc(S)).then(function(){
      dirty=false; saving=false; cb(true,'已存檔，其他人的畫面會跟著更新','ok');
    }).catch(function(err){
      saving=false;
      var code=String((err&&(err.code||err.name))||'');
      if(code.indexOf('demo')>=0){
        cb(false,'這是本機示範版，不會真的存檔——正式版按下去就會同步給所有人','warn');
      } else if(code.indexOf('conflict')>=0){
        cb(false,'剛剛有別人同時存檔——畫面會換成他的版本，你這次填的要再填一次','warn');
      } else if(code.indexOf('not_writer')>=0||code.indexOf('not_granted')>=0){
        canWrite=false; applyReadOnly(); cb(false,'你沒有編輯權限','warn');
      } else { cb(false,'存檔失敗，再按一次試試','warn'); }
    });
  }
  function onSave(){
    var btn=document.getElementById('save');
    if(saving) return;
    btn.disabled=true; msg('存檔中…','');
    saveNow(function(ok,message,cls){ btn.disabled=false; msg(message,cls); });
  }

  function applyReadOnly(){
    var b=document.getElementById('save'); if(b) b.disabled=true;
    var a=document.getElementById('add'); if(a) a.disabled=true;
    var box=document.getElementById('roBox');
    if(box) box.innerHTML='<div class="ro"><strong>你目前是唯讀。</strong>看得到全部進度，但改不了。'+
      '要能填自己那一張，請 Eason 從分享選單把你設成可編輯。</div>';
  }

  window.addEventListener('beforeunload', function(e){ if(dirty){ e.preventDefault(); e.returnValue=''; } });

  render();

  canWrite=true;
  artifact={ publish:function(){ return Promise.reject({code:'demo'}); } };
})();
</script>
</body>
</html>
